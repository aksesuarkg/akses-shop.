<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Admin — Панель управления</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Шапка админки -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 p-2 rounded-xl text-slate-900">
          <i class="fa-solid fa-user-shield text-xl"></i>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight text-white">Akses<span class="text-amber-400">.Admin</span></span>
          <span class="block text-[10px] text-slate-400 -mt-1">Панель администратора</span>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700">
          <i class="fa-solid fa-circle text-emerald-400 text-[10px] mr-1.5"></i>Система активна
        </span>
      </div>
    </div>
  </header>

  <!-- Навигация по вкладкам -->
  <div class="bg-white border-b sticky top-16 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex space-x-4 overflow-x-auto">
      <button onclick="switchTab('orders')" id="tabBtn-orders" class="py-3 px-4 text-sm font-bold border-b-2 border-amber-500 text-amber-600 flex items-center space-x-2">
        <i class="fa-solid fa-list-check"></i>
        <span>Заказы и чеки</span>
        <span id="pendingBadge" class="bg-amber-500 text-slate-900 text-xs px-2 py-0.5 rounded-full hidden">0</span>
      </button>
      <button onclick="switchTab('products')" id="tabBtn-products" class="py-3 px-4 text-sm font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex items-center space-x-2">
        <i class="fa-solid fa-boxes-stacked"></i>
        <span>Управление ассортиментом</span>
      </button>
    </div>
  </div>

  <!-- Главный контент -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- Вкладка 1: Заказы и чеки -->
    <section id="tab-orders" class="space-y-6">
      <h2 class="text-xl font-bold text-slate-800">Заказы клиентов</h2>
      <div id="ordersContainer" class="space-y-4">
        <!-- Список заказов -->
      </div>
    </section>

    <!-- Вкладка 2: Управление ассортиментом -->
    <section id="tab-products" class="space-y-6 hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-2xl border shadow-sm">
        <div>
          <h2 class="text-xl font-bold text-slate-800">Ассортимент магазина</h2>
          <p class="text-xs text-gray-500">Здесь вы можете редактировать название, менять цены и обновлять фото товаров</p>
        </div>
        <button onclick="openProductModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold px-4 py-2.5 rounded-xl text-sm transition flex items-center space-x-2 shadow-md shadow-amber-500/20">
          <i class="fa-solid fa-plus"></i>
          <span>Добавить новый товар</span>
        </button>
      </div>

      <!-- Поиск по ассортименту -->
      <div class="relative max-w-md">
        <input type="text" id="adminSearchInput" oninput="renderAdminProducts()" placeholder="Поиск по названию или категории..." class="w-full bg-white border border-gray-200 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-xs"></i>
      </div>

      <!-- Сетка товаров -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="adminProductsGrid">
        <!-- Карточки товаров в админке -->
      </div>
    </section>

  </main>

  <!-- Модалка просмотра чека -->
  <div id="receiptModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <h3 class="font-bold text-sm">Проверка чека оплаты</h3>
        <button onclick="closeReceiptModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-4 text-center">
        <img id="modalReceiptImg" class="max-h-[60vh] mx-auto rounded-xl border" alt="Чек оплаты">
      </div>
    </div>
  </div>

  <!-- Модалка Добавления / Редактирования товара -->
  <div id="productModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-extrabold text-lg text-slate-900" id="productModalTitle">Добавить товар в ассортимент</h3>
        <button onclick="closeProductModal()" class="text-gray-400 hover:text-slate-800"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <form onsubmit="saveProduct(event)" class="space-y-4">
        <input type="hidden" id="prodId">
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Название товара / аксессуара *</label>
          <input type="text" id="prodName" required placeholder="Например: Чехол MagSafe iPhone 15" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Категория *</label>
            <input type="text" id="prodCat" required placeholder="например: Чехлы" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Цена (сом) *</label>
            <input type="number" id="prodPrice" required placeholder="750" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ссылка на фото товара (URL) *</label>
          <input type="url" id="prodImg" required oninput="previewProductImage()" placeholder="https://images.unsplash.com/..." class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <!-- Предпросмотр изображения -->
        <div class="border rounded-xl p-2 text-center bg-slate-50 min-h-[100px] flex items-center justify-center">
          <img id="modalImgPreview" class="max-h-32 rounded-lg shadow-sm hidden" alt="Предпросмотр фото">
          <span id="noImgText" class="text-xs text-gray-400">Вставьте ссылку на фото выше для предпросмотра</span>
        </div>

        <div class="flex space-x-2 pt-2">
          <button type="button" onclick="closeProductModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 py-3 rounded-xl font-bold text-sm transition">Отмена</button>
          <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-900 py-3 rounded-xl font-extrabold text-sm transition shadow-md shadow-amber-500/20">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const defaultProducts = [
      { id: 1, name: 'Чехол Silicone Cover iPhone 15 Pro', category: 'Чехлы', price: 650, image: 'https://images.unsplash.com/photo-1603313011101-320f26a4f6f6?w=400' },
      { id: 2, name: 'Защитное стекло 9D iPhone 14/15', category: 'Защитные стекла', price: 350, image: 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=400' },
      { id: 3, name: 'Быстрая зарядка 20W USB-C Power Adapter', category: 'Зарядные устройства', price: 950, image: 'https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=400' },
      { id: 4, name: 'Кабель Type-C to Lightning 1m', category: 'Кабели', price: 450, image: 'https://images.unsplash.com/photo-1585338107529-13afc5f02586?w=400' },
      { id: 5, name: 'Беспроводные наушники AirPods Pro 2 (копия)', category: 'Наушники', price: 2500, image: 'https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=400' }
    ];

    let products = JSON.parse(localStorage.getItem('akses_products')) || defaultProducts;

    function init() {
      renderOrders();
      renderAdminProducts();
    }

    function switchTab(tab) {
      document.getElementById('tab-orders').classList.toggle('hidden', tab !== 'orders');
      document.getElementById('tab-products').classList.toggle('hidden', tab !== 'products');

      document.getElementById('tabBtn-orders').className = tab === 'orders' ? 'py-3 px-4 text-sm font-bold border-b-2 border-amber-500 text-amber-600 flex items-center space-x-2' : 'py-3 px-4 text-sm font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex items-center space-x-2';
      document.getElementById('tabBtn-products').className = tab === 'products' ? 'py-3 px-4 text-sm font-bold border-b-2 border-amber-500 text-amber-600 flex items-center space-x-2' : 'py-3 px-4 text-sm font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex items-center space-x-2';
    }

    function renderOrders() {
      const orders = JSON.parse(localStorage.getItem('akses_orders')) || [];
      const container = document.getElementById('ordersContainer');
      const pendingBadge = document.getElementById('pendingBadge');

      const pendingCount = orders.filter(o => o.paymentStatus === 'Ожидает проверки').length;
      if(pendingCount > 0) {
        pendingBadge.innerText = pendingCount;
        pendingBadge.classList.remove('hidden');
      } else {
        pendingBadge.classList.add('hidden');
      }

      if(orders.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-400 bg-white rounded-2xl border">Заказов пока нет</div>`;
        return;
      }

      container.innerHTML = orders.map(o => `
        <div class="bg-white rounded-2xl p-5 border shadow-sm flex flex-col md:flex-row justify-between gap-4">
          <div class="space-y-2">
            <div class="flex items-center space-x-2">
              <span class="font-extrabold text-sm text-slate-900">Заказ #${o.id}</span>
              <span class="text-xs text-gray-400">${o.date}</span>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${o.paymentStatus === 'Подтвержден' ? 'bg-emerald-100 text-emerald-800' : (o.paymentStatus === 'Отклонен' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800')}">${o.paymentStatus}</span>
            </div>
            <p class="text-xs text-gray-600"><strong>Покупатель:</strong> ${o.customer.name} (${o.customer.phone})</p>
            <p class="text-xs text-gray-600"><strong>Адрес:</strong> ${o.customer.address}</p>
            <div class="text-xs text-slate-700 font-medium">
              <strong>Товары:</strong> ${o.items.map(i => `${i.name} (${i.qty} шт.)`).join(', ')}
            </div>
            <p class="text-sm font-extrabold text-slate-900">Сумма: ${o.total} сом</p>
          </div>

          <div class="flex flex-col justify-between items-end space-y-2">
            ${o.receipt ? `<button onclick="viewReceipt('${o.receipt}')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-3 py-1.5 rounded-xl"><i class="fa-solid fa-receipt mr-1"></i>Посмотреть чек</button>` : '<span class="text-xs text-gray-400">Без чека</span>'}
            
            <div class="flex space-x-2">
              <button onclick="setPaymentStatus(${o.id}, 'Подтвержден')" class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold text-xs px-3 py-1.5 rounded-xl">Подтвердить</button>
              <button onclick="setPaymentStatus(${o.id}, 'Отклонен')" class="bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl">Отклонить</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setPaymentStatus(orderId, status) {
      let orders = JSON.parse(localStorage.getItem('akses_orders')) || [];
      const order = orders.find(o => o.id === orderId);
      if(order) {
        order.paymentStatus = status;
        localStorage.setItem('akses_orders', JSON.stringify(orders));
        renderOrders();
      }
    }

    function viewReceipt(src) {
      document.getElementById('modalReceiptImg').src = src;
      document.getElementById('receiptModal').classList.remove('hidden');
    }

    function closeReceiptModal() {
      document.getElementById('receiptModal').classList.add('hidden');
    }

    // РЕНДЕР ТОВАРОВ В АДМИНКЕ С ВОЗМОЖНОСТЬЮ РЕДАКТИРОВАНИЯ И СМЕНЫ ЦЕН/ФОТО
    function renderAdminProducts() {
      const search = (document.getElementById('adminSearchInput')?.value || '').toLowerCase();
      const grid = document.getElementById('adminProductsGrid');

      const filtered = products.filter(p => p.name.toLowerCase().includes(search) || p.category.toLowerCase().includes(search));

      if(filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 bg-white rounded-2xl border">Ассортимент пуст или ничего не найдено</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="bg-white rounded-2xl p-4 border shadow-sm flex space-x-3 items-center hover:border-amber-400 transition">
          <img src="${p.image}" class="w-20 h-20 rounded-xl object-cover bg-gray-50 border" alt="${p.name}">
          <div class="flex-1">
            <span class="text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">${p.category}</span>
            <h4 class="font-bold text-sm text-slate-900 mt-0.5 line-clamp-1">${p.name}</h4>
            <p class="text-sm font-extrabold text-emerald-600 mt-1">${p.price} сом</p>
          </div>
          <div class="flex flex-col space-y-2 border-l pl-3">
            <button onclick="editProduct(${p.id})" class="p-2 text-slate-600 hover:text-amber-600 hover:bg-amber-50 rounded-xl transition" title="Редактировать товар и фото">
              <i class="fa-solid fa-pen text-sm"></i>
            </button>
            <button onclick="deleteProduct(${p.id})" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition" title="Удалить товар">
              <i class="fa-solid fa-trash text-sm"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function openProductModal(prod = null) {
      document.getElementById('productModalTitle').innerText = prod ? 'Редактировать товар' : 'Добавить товар в ассортимент';
      document.getElementById('prodId').value = prod ? prod.id : '';
      document.getElementById('prodName').value = prod ? prod.name : '';
      document.getElementById('prodCat').value = prod ? prod.category : '';
      document.getElementById('prodPrice').value = prod ? prod.price : '';
      document.getElementById('prodImg').value = prod ? prod.image : '';
      
      previewProductImage();
      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    function previewProductImage() {
      const url = document.getElementById('prodImg').value;
      const imgEl = document.getElementById('modalImgPreview');
      const textEl = document.getElementById('noImgText');

      if(url) {
        imgEl.src = url;
        imgEl.classList.remove('hidden');
        textEl.classList.add('hidden');
      } else {
        imgEl.classList.add('hidden');
        textEl.classList.remove('hidden');
      }
    }

    function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('prodId').value;
      const name = document.getElementById('prodName').value;
      const category = document.getElementById('prodCat').value;
      const price = Number(document.getElementById('prodPrice').value);
      const image = document.getElementById('prodImg').value;

      if(id) {
        // Редактирование существующего товара
        const index = products.findIndex(p => p.id === Number(id));
        if(index !== -1) {
          products[index] = { id: Number(id), name, category, price, image };
        }
      } else {
        // Добавление нового товара
        products.push({ id: Date.now(), name, category, price, image });
      }

      localStorage.setItem('akses_products', JSON.stringify(products));
      closeProductModal();
      renderAdminProducts();
      alert(id ? 'Товар успешно обновлен!' : 'Новый товар добавлен в каталог!');
    }

    function editProduct(id) {
      const prod = products.find(p => p.id === id);
      if(prod) openProductModal(prod);
    }

    function deleteProduct(id) {
      if(confirm('Вы уверены, что хотите удалить этот товар из ассортимента?')) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('akses_products', JSON.stringify(products));
        renderAdminProducts();
      }
    }

    init();
  </script>
</body>
</html>
